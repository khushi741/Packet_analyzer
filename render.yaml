services:
  - type: web
    name: packet-analyzer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ml.realtime_inference:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
